<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion aftereffect · short v2</title>
<style>
  /* v2 layout law, shared across the three shorts.
     The frame is three bands and type NEVER enters the stimulus band:
       HEADER    0..470     chapter, piece, line, sub
       STIMULUS  470..1450  the canvas figure, centred on cy=960
       FOOT      1450..1920 countdown, then the end card
     v1 put #line at 266 with a 68px face; the two-line reveal ran to 440 while
     the spiral's top edge was 397, so the last words sat on the moving arms.
     The fix is structural (bands + a 470 ceiling on the figure), not a nudge. */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#0c0b09}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0}
  .t{position:fixed;left:0;width:1080px;text-align:center;pointer-events:none}
  #chapter{top:100px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:24px;
    letter-spacing:0.30em;text-transform:uppercase;color:rgba(232,224,208,0.55)}
  #piece{top:142px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:20px;
    letter-spacing:0.18em;text-transform:uppercase;color:rgba(232,224,208,0.40)}
  #line{top:236px;font-size:62px;font-weight:300;color:#e8e0d0;padding:0 80px;line-height:1.24}
  #sub{top:402px;font-size:32px;font-weight:300;color:rgba(232,224,208,0.55)}
  /* countdown lives BELOW the figure in v2; in v1 it sat at 378, on the spiral */
  #count{top:1548px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:30px;
    letter-spacing:0.10em;color:rgba(232,224,208,0.50)}
  #veil{position:fixed;inset:0;background:#0c0b09}
  #close1{top:800px;font-size:52px;font-weight:300;color:#e8e0d0;padding:0 90px;line-height:1.35}
  #close2{top:1030px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:24px;
    letter-spacing:0.26em;text-transform:uppercase;color:rgba(232,224,208,0.45)}
  #close3{top:1090px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:28px;
    letter-spacing:0.10em;color:#e8e0d0}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="t" id="chapter">Photon to Phenomenology</div>
<div class="t" id="piece">the motion aftereffect</div>
<div class="t" id="line"></div>
<div class="t" id="sub"></div>
<div class="t" id="count"></div>
<div id="veil"></div>
<div class="t" id="close1">Vision is not recording,<br>it is construction.</div>
<div class="t" id="close2">Photon to Phenomenology</div>
<div class="t" id="close3">ciamac.com</div>
<script>
"use strict";
/* v2 is 22s, down from 30s. The floor is perceptual, not editorial: the motion
   aftereffect needs real adaptation, and below roughly ten seconds of rotation
   the illusion gets weak enough that a viewer may see nothing and conclude the
   piece is broken. 11.8s of rotation is the shortest that still lands. */
const FPS=30, DUR=22;
const T_RAMP0=1.2, T_RAMP1=2.2, T_STOP=13.0, OMEGA=2.6;
/* T_DRIFT/T_END were 16.0/17.5 on the first v2 pass, which left the payoff line
   1.5s on screen before the end card began covering it. The strongest line in
   the piece needs to sit. Shortening the cut is not licence to clip the point
   of it. */
const T_NOW=15.5, T_DRIFT=15.5, T_END=19.0;
window.SHORT={fps:FPS, frames:DUR*FPS};

const ctx=document.getElementById('c').getContext('2d');
const el=id=>document.getElementById(id);
/* maxR 470 (was 520) so the figure's top edge, including half the stroke,
   clears the 470 header ceiling: 960 - 470 - 12 = 478. */
const cx=540, cy=960, maxR=470;

function fadeIn(t,a,d){return Math.max(0,Math.min(1,(t-a)/d));}
function setText(id,txt,op){const e=el(id); e.textContent=txt; e.style.opacity=op;}

// analytic rotation: 0 until ramp, eased ramp to OMEGA, constant, frozen after stop
function rotAt(t){
  const tc=Math.min(t,T_STOP);
  if(tc<=T_RAMP0) return 0;
  if(tc<=T_RAMP1){ const u=tc-T_RAMP0; return OMEGA*u*u/(2*(T_RAMP1-T_RAMP0)); }
  return OMEGA*(T_RAMP1-T_RAMP0)/2 + OMEGA*(tc-T_RAMP1);
}

window.seek=function(f){
  const t=f/FPS;
  const rot=rotAt(t);

  ctx.fillStyle='#0c0b09'; ctx.fillRect(0,0,1080,1920);

  // two-arm Archimedean spiral, cream, rotating = continuous expansion
  const ARMS=2, TURNS=5.2, k=maxR/(TURNS*2*Math.PI);
  ctx.lineWidth=maxR*0.05; ctx.lineCap='round'; ctx.strokeStyle='#e8e0d0';
  for(let a0=0;a0<ARMS;a0++){
    const base=rot + a0*Math.PI;
    ctx.beginPath(); let first=true;
    for(let th=0; th<=TURNS*2*Math.PI; th+=0.08){
      const r=k*th, ang=th+base;
      const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
      if(first){ ctx.moveTo(x,y); first=false; } else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  // fixation dot
  ctx.beginPath(); ctx.arc(cx,cy,7,0,Math.PI*2); ctx.fillStyle='#0c0b09'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,7,0,Math.PI*2); ctx.lineWidth=2.5; ctx.strokeStyle='#e8e0d0'; ctx.stroke();

  /* Text timeline. Every line is short enough to set on ONE line at 62px inside
     the 920px measure, so the header band cannot grow into the figure. */
  if(t<T_RAMP1){
    setText('line','Eyes on the centre dot.',fadeIn(t,0.2,0.6));
    setText('sub','',0); setText('count','',0);
  } else if(t<T_STOP){
    setText('line','Hold. Do not look away.',1);
    setText('sub','',0);
    setText('count',String(Math.ceil(T_STOP-t)),fadeIn(t,2.6,0.5));
  } else if(t<T_NOW){
    setText('line','Now. Nothing moves.',fadeIn(t,T_STOP,0.4));
    setText('sub','',0); setText('count','',0);
  } else {
    setText('line','The drift is you.',fadeIn(t,T_DRIFT,0.6));
    setText('sub','',0); setText('count','',0);
  }

  // end card
  const c=fadeIn(t,T_END,1.2);
  el('veil').style.opacity=c*0.92;
  el('close1').style.opacity=c;
  el('close2').style.opacity=c;
  el('close3').style.opacity=c;
  if(c>0){ el('line').style.opacity=1-c; }
};
window.seek(0);
</script>
</body>
</html>
