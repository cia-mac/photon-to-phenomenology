<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gestalt Grouping · Proximity vs Similarity</title>
<link rel="stylesheet" href="chrome_app.css">
<style>
  :root{
    --field:#0c0b09;
    --cream:#e8e0d0;
    --caspian:#4d7fe0;
    --caspian-bright:#78b4ff;
    --mono:"SF Mono", ui-monospace, Menlo, Monaco, "Cascadia Mono", monospace;
    --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--field);
    color:var(--cream);
    font-family:var(--sans);
    font-weight:300;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:var(--shell-top) max(clamp(16px,5vw,32px),var(--shell-side)) var(--shell-bottom);
  }
  .eyebrow{
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:12px;
    color:var(--cream);
    margin:0 0 6px;
    line-height:1.5;
  }
  .subline{
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:10.5px;
    color:var(--cream);
    opacity:0.62;
    margin:0 0 22px;
  }
  .instruction{
    font-family:var(--sans);
    font-weight:300;
    font-size:clamp(15px,2.6vw,18px);
    line-height:1.55;
    color:var(--cream);
    max-width:56ch;
    margin:0 0 30px;
  }
  .stage{
    display:flex;
    justify-content:center;
    margin:0 auto 34px;
  }
  svg.field{
    width:min(100%,560px);
    width:min(100%,560px,max(200px,calc(100vh - 440px)));
    width:min(100%,560px,max(200px,calc(100svh - 440px)));
    height:auto;
    touch-action:none;
    aspect-ratio:1 / 1;
    display:block;
  }
  .controls{
    display:flex;
    flex-direction:column;
    gap:30px;
    max-width:560px;
    margin:0 auto;
  }
  .ctrl{display:flex;flex-direction:column;gap:9px;}
  .ctrl-head{
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:11px;
    color:var(--cream);
  }
  .ends{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:0.1em;
    font-size:10px;
    color:var(--cream);
    opacity:0.7;
  }
  .ends .mid{opacity:0.55;}
  .readout{
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-size:11px;
    line-height:1.5;
    color:var(--caspian);
    margin-top:2px;
  }
  .readout.inactive{color:var(--cream);opacity:0.6;}

  /* ---- range input ---- */
  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:44px;
    min-height:44px;
    touch-action:pan-x;
    background:transparent;
    margin:0;
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:2px;
    background:#2a2924;
    border-radius:2px;
  }
  input[type=range]::-moz-range-track{
    height:2px;
    background:#2a2924;
    border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:18px;height:18px;
    margin-top:-8px;
    border-radius:50%;
    background:var(--caspian);
    border:none;
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;
    border-radius:50%;
    background:var(--caspian);
    border:none;
  }
  input[type=range]:hover::-webkit-slider-thumb{background:var(--caspian-bright);}
  input[type=range]:hover::-moz-range-thumb{background:var(--caspian-bright);}
  input[type=range]:focus-visible{outline:none;}
  input[type=range]:focus-visible::-webkit-slider-thumb{
    outline:2px solid var(--caspian-bright);
    outline-offset:3px;
  }
  input[type=range]:focus-visible::-moz-range-thumb{
    outline:2px solid var(--caspian-bright);
    outline-offset:3px;
  }

  /* ---- segmented toggle ---- */
  .seg{display:flex;gap:0;border:1px solid var(--caspian);border-radius:3px;overflow:hidden;width:max-content;}
  .seg button{
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:11px;
    padding:9px 18px;
    min-height:44px;
    min-width:44px;
    background:transparent;
    color:var(--caspian);
    border:none;
    cursor:pointer;
  }
  .seg button + button{border-left:1px solid var(--caspian);}
  .seg button[aria-pressed=true]{background:var(--caspian);color:var(--field);}
  .seg button:hover{color:var(--caspian-bright);}
  .seg button[aria-pressed=true]:hover{color:var(--field);}
  .seg button:focus-visible{
    outline:2px solid var(--caspian-bright);
    outline-offset:3px;
  }

  /* ---- phone: fit the existing layout in 402 px wide and 874 px tall ---- */
  @media (max-width:680px){
    .subline{margin-bottom:12px;}
    .instruction{margin-bottom:16px;}
    .stage{margin-bottom:14px;}
    svg.field{
      width:min(100%,560px,max(200px,calc(100vh - 600px)));
      width:min(100%,560px,max(200px,calc(100svh - 600px)));
    }
    .controls{gap:14px;}
    .ctrl{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:4px;align-items:center;}
    .ctrl-head{grid-column:1;}
    .ends{grid-column:2;}
    .ctrl > input,.ctrl > .readout,.ctrl > .seg{grid-column:1 / -1;}
    .ctrl > .readout{margin-top:0;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">GESTALT GROUPING · PROXIMITY vs SIMILARITY</p>
    <p class="subline">PALMER §6.1 · PRINCIPLES OF GROUPING</p>
    <p class="instruction">Drag the sliders. The dots never change which dot they are; your visual system decides whether they are rows or columns.</p>

    <div class="stage">
      <svg class="field" viewBox="0 0 100 100" role="img" aria-label="Dot field: 64 cream dots on an 8 by 8 lattice. Their spacing and per-dot feature values are the only physical variables; the grouping into rows or columns is left to your perception."></svg>
    </div>

    <div class="controls">

      <div class="ctrl">
        <label class="ctrl-head" for="proximity">Proximity</label>
        <div class="ends"><span>⟵ ROWS</span><span class="mid">AMBIGUOUS</span><span>COLUMNS ⟶</span></div>
        <input type="range" id="proximity" min="-1" max="1" step="0.01" value="0"
               aria-label="Proximity: drag left to squeeze dots closer horizontally (favors rows), center for a square lattice (ambiguous), right to squeeze closer vertically (favors columns)"
               aria-describedby="proximity-readout">
        <div class="readout inactive" id="proximity-readout" aria-live="polite"></div>
      </div>

      <div class="ctrl">
        <label class="ctrl-head" for="similarity">Similarity</label>
        <div class="ends"><span>0</span><span>MAX ⟶</span></div>
        <input type="range" id="similarity" min="0" max="1" step="0.01" value="0"
               aria-label="Similarity: raises the feature difference between alternate columns from zero to maximum, making columns the similar sets"
               aria-describedby="similarity-readout">
        <div class="readout inactive" id="similarity-readout" aria-live="polite"></div>
      </div>

      <div class="ctrl">
        <span class="ctrl-head" id="feature-label">Feature</span>
        <div class="seg" role="group" aria-labelledby="feature-label">
          <button type="button" id="feat-lightness" aria-pressed="true">LIGHTNESS</button>
          <button type="button" id="feat-size" aria-pressed="false">SIZE</button>
        </div>
      </div>

    </div>
  </main>

<script src="chrome_app.js"></script>
<script>
(function(){
  "use strict";
  var N = 8;
  var BASE = 60 / 7;      // baseline gap so the square lattice fills the field with margin
  var H = 0.32;           // proximity exponent (controls max gap ratio ~1.9 : 0.53)
  var R0 = 3.0;           // baseline dot radius
  var CX = 50, CY = 50;   // field center
  var CREAM = [232, 224, 208];
  var DIM   = [92, 86, 74]; // similarity-dimmed cream: still clearly visible above the field

  var p = 0;              // PROXIMITY slider only -> dot centers
  var s = 0;              // SIMILARITY slider only -> feature values
  var feature = "lightness";
  var wasAmbiguous = true; // proximity is ambiguous at load; for the shell haptic

  var svg = document.querySelector("svg.field");
  var proxIn = document.getElementById("proximity");
  var simIn = document.getElementById("similarity");
  var proxOut = document.getElementById("proximity-readout");
  var simOut = document.getElementById("similarity-readout");
  var btnLight = document.getElementById("feat-lightness");
  var btnSize = document.getElementById("feat-size");

  function lerp(a, b, t){ return Math.round(a + (b - a) * t); }
  function creamRGB(){ return "rgb(232,224,208)"; }
  function dimRGB(t){
    return "rgb(" + lerp(CREAM[0],DIM[0],t) + "," + lerp(CREAM[1],DIM[1],t) + "," + lerp(CREAM[2],DIM[2],t) + ")";
  }

  function render(){
    // Centers depend on PROXIMITY only.
    var dx = BASE * Math.exp(p * H);   // horizontal gap
    var dy = BASE * Math.exp(-p * H);  // vertical gap
    var out = "";
    for (var j = 0; j < N; j++){
      for (var i = 0; i < N; i++){
        var cx = CX + (i - 3.5) * dx;
        var cy = CY + (j - 3.5) * dy;
        var odd = (i % 2) === 1;       // alternate columns carry the similarity feature
        var r = R0;
        var fill = creamRGB();
        // Feature values depend on SIMILARITY + column parity only. Never touches cx/cy.
        if (odd){
          if (feature === "size"){ r = R0 * (1 - 0.62 * s); } // scales about the fixed center
          else { fill = dimRGB(s); }
        }
        out += '<circle cx="' + cx.toFixed(3) + '" cy="' + cy.toFixed(3) +
               '" r="' + r.toFixed(3) + '" fill="' + fill + '"/>';
      }
    }
    svg.innerHTML = out;
    updateReadouts(dx, dy);
  }

  function updateReadouts(dx, dy){
    // PROXIMITY: physical gap ratio + ceteris-paribus prediction only. Never asserts the percept.
    var ratio = dy / dx;
    var pred;
    if (Math.abs(p) < 0.02){ pred = "AMBIGUOUS (dy:dx = 1:1)"; }
    else if (ratio > 1){ pred = "PROXIMITY FAVORS ROWS"; }
    else { pred = "PROXIMITY FAVORS COLUMNS"; }
    proxOut.textContent = "GAP RATIO  dy:dx = " + ratio.toFixed(2) + " : 1 · " + pred;
    proxOut.classList.toggle("inactive", Math.abs(p) < 0.02);
    var ambiguous = Math.abs(p) < 0.02; if (ambiguous !== wasAmbiguous){ wasAmbiguous = ambiguous; PhotonApp.haptic("reveal"); }

    // SIMILARITY: physical feature-difference percentage + prediction only.
    var pct = Math.round(s * 100);
    var feat = (feature === "lightness") ? "LIGHTNESS" : "SIZE";
    if (pct === 0){
      simOut.textContent = feat + " DIFFERENCE 0% · SIMILARITY INACTIVE";
      simOut.classList.add("inactive");
    } else {
      simOut.textContent = feat + " DIFFERENCE " + pct + "% · SIMILARITY FAVORS COLUMNS";
      simOut.classList.remove("inactive");
    }
  }

  proxIn.addEventListener("input", function(){ p = parseFloat(proxIn.value); render(); });
  simIn.addEventListener("input", function(){ s = parseFloat(simIn.value); render(); });

  function setFeature(f){
    feature = f;
    var isLight = (f === "lightness");
    btnLight.setAttribute("aria-pressed", isLight ? "true" : "false");
    btnSize.setAttribute("aria-pressed", isLight ? "false" : "true");
    render();
  }
  btnLight.addEventListener("click", function(){ setFeature("lightness"); });
  btnSize.addEventListener("click", function(){ setFeature("size"); });

  render();
})();
</script>
</body>
</html>
